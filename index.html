<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TabCoin</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --accent-gold: #fbbf24;
            --accent-gold-glow: rgba(251, 191, 36, 0.4);
            --text-white: #ffffff;
            --text-secondary: #94a3b8;
            --panel-bg: rgba(15, 23, 42, 0.82);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-image: url('1790097907298.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: var(--text-white);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 0;
        }

        header, .tab-content, nav {
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 15px 0 5px 0;
        }

        .game-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .balance-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .coin-icon {
            width: 36px;
            height: 36px;
            background: var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            color: #78350f;
            box-shadow: 0 0 15px var(--accent-gold-glow);
        }

        .balance-score {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .tab-content {
            flex: 1;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 0 20px;
            overflow-y: auto;
        }

        .tab-content.active {
            display: flex;
        }

        .character-wrapper {
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        .character-wrapper:active {
            transform: scale(0.95);
        }

        .character-img {
            width: 320px;
            height: 320px;
            object-fit: contain;
            transform: scale(1.3);
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
        }

        .energy-section {
            width: 100%;
            max-width: 320px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }

        .energy-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .energy-title {
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .energy-bar-container {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .energy-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            border-radius: 5px;
            width: 100%;
            transition: width 0.2s ease;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--accent-gold);
            align-self: flex-start;
            max-width: 340px;
            margin-left: auto;
            margin-right: auto;
        }

        .items-list {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        .item-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
        }

        .item-info h4 {
            font-size: 15px;
            margin-bottom: 4px;
        }

        .item-info p {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .item-btn {
            background: var(--accent-gold);
            color: #78350f;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .item-btn:active {
            opacity: 0.8;
        }

        .item-btn:disabled {
            background: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }

        nav {
            display: flex;
            justify-content: space-around;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            padding: 12px 0;
            backdrop-filter: blur(15px);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-item.active {
            color: var(--accent-gold);
        }

        .nav-icon {
            font-size: 20px;
        }

        .click-pop {
            position: absolute;
            font-weight: bold;
            font-size: 24px;
            color: var(--accent-gold);
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            z-index: 10;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-80px) scale(1.3);
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="game-title">TabCoin Mining</div>
        <div class="balance-container">
            <div class="coin-icon">🪙</div>
            <div class="balance-score" id="score">764</div>
        </div>
    </header>

    <div class="tab-content active" id="tab-tap">
        <div class="character-wrapper" id="clickArea">
            <img src="1790090929041.png" alt="Крокодил" class="character-img">
