   <!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TabCoin Clicker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-green: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.4);
      --gold: #f59e0b;
      --text-white: #f8fafc;
      --text-gray: #94a3b8;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Верхня панель монети */
    .header {
      padding: 20px 0 10px 0;
      text-align: center;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--text-gray);
      text-transform: uppercase;
    }

    .balance-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    .coin-icon-small {
      width: 38px;
      height: 38px;
    }

    .balance {
      font-size: 2.8rem;
      font-weight: 900;
      color: var(--text-white);
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    /* Головна зона для кліку */
    .click-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .coin-wrapper {
      position: relative;
      width: 240px;
      height: 240px;
    }

    .coin-btn {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #34d399, #059669, #064e3b);
      border: 8px solid #10b981;
      box-shadow: 0 0 40px var(--accent-glow), inset 0 0 15px rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.08s ease-out;
      outline: none;
    }

    .coin-btn:active {
      transform: scale(0.94);
    }

    .coin-inner-symbol {
      font-size: 6rem;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    }

    /* Впліваючий текст +1 */
    .plus-one {
      position: absolute;
      font-size: 2rem;
      font-weight: 900;
      color: #5eead4;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      text-shadow: 0 0 10px var(--accent-glow);
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-80px) scale(1.3);
      }
    }

    /* Спеціальна шкала енергії */
    .energy-container {
      padding: 0 25px 15px 25px;
    }

    .energy-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .energy-title {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #fcd34d;
    }

    .energy-bar-bg {
      width: 100%;
      height: 12px;
      background-color: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .energy-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      border-radius: 10px;
      transition: width 0.2s ease;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
    }

    /* Нижнє меню вкладками */
    .navbar {
      display: flex;
      justify-content: space-around;
      background-color: var(--card-bg);
      padding: 12px 0 20px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-gray);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    .nav-item.active {
      color: var(--accent-green);
    }

    .nav-icon {
      font-size: 1.4rem;
    }
  </style>
</head>
<body>

  <!-- Верхня панель -->
  <div class="header">
    <div class="title">TabCoin Mining</div>
    <div class="balance-container">
      <span style="font-size: 2.5rem;">🪙</span>
      <span class="balance" id="score">0</span>
    </div>
  </div>

  <!-- Головна кнопка кліку -->
  <div class="click-area" id="clickArea">
    <div class="coin-wrapper">
      <button class="coin-btn" id="coinBtn">
        <span class="coin-inner-symbol">⚽</span>
      </button>
    </div>
  </div>

  <!-- Шкала енергії -->
  <div class="energy-container">
    <div class="energy-header">
      <div class="energy-title">⚡ Енергія</div>
      <div><span id="energy">1000</span> / <span id="maxEnergy">1000</span></div>
    </div>
    <div class="energy-bar-bg">
      <div class="energy-bar-fill" id="energyFill"></div>
    </div>
  </div>

  <!-- Нижнє меню -->
  <div class="navbar">
    <div class="nav-item active">
      <span class="nav-icon">⚡</span>
      <span>Тап</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">🚀</span>
      <span>Бусти</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">📋</span>
      <span>Завдання</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">👥</span>
      <span>Друзі</span>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Завантаження збережених даних
    let score = parseInt(localStorage.getItem('tabcoin_score')) || 0;
    let energy = parseInt(localStorage.getItem('tabcoin_energy')) || 1000;
    const maxEnergy = 1000;

    const scoreEl = document.getElementById('score');
    const energyEl = document.getElementById('energy');
    const energyFill = document.getElementById('energyFill');
    const coinBtn = document.getElementById('coinBtn');
    const clickArea = document.getElementById('clickArea');

    // Оновлення інтерфейсу
    function updateUI() {
      scoreEl.innerText = score.toLocaleString();
      energyEl.innerText = energy;
      const percentage = (energy / maxEnergy) * 100;
      energyFill.style.width = percentage + '%';
      
      // Збереження в пам'ять
      localStorage.setItem('tabcoin_score', score);
      localStorage.setItem('tabcoin_energy', energy);
    }

    updateUI();

    // Обробник натискань
    coinBtn.addEventListener('click', (e) => {
      if (energy <= 0) {
        if (tg.HapticFeedback) {
          tg.HapticFeedback.notificationOccurred('error');
        }
        return;
      }

      score += 1;
      energy -= 1;
      updateUI();

      // Вібрація
      if (tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('medium');
      }

      // Анімація вилітаючого +1
      const rect = coinBtn.getBoundingClientRect();
      const x = e.clientX || (rect.left + rect.width / 2);
      const y = e.clientY || (rect.top + rect.height / 2);

      const plusOne = document.createElement('div');
      plusOne.classList.add('plus-one');
      plusOne.innerText = '+1';
      plusOne.style.left = (x - 20) + 'px';
      plusOne.style.top = (y - 40) + 'px';

      document.body.appendChild(plusOne);

      setTimeout(() => {
        plusOne.remove();
      }, 800);
    });

    // Автоматичне відновлення енергії (+1 кожну секунду)
    setInterval(() => {
      if (energy < maxEnergy) {
        energy += 1;
        updateUI();
      }
    }, 1000);
  </script>
</body>
</html>
