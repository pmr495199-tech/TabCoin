<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TabCoin Clicker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            position: relative;
        }
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 90px;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        
        /* Статистика зверху */
        .header-stats {
            display: flex;
            justify-content: space-around;
            background: #1e293b;
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #38bdf8;
        }
        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }

        /* Головний клікер */
        .clicker-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }
        .coin-display {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 30px;
            color: #facc15;
        }
        .click-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, #fde047 0%, #eab308 100%);
            border: none;
            box-shadow: 0 10px 25px rgba(234, 179, 8, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            transition: transform 0.1s ease;
        }
        .click-btn:active {
            transform: scale(0.92);
        }
        .energy-bar-container {
            width: 100%;
            background: #1e293b;
            border-radius: 10px;
            height: 14px;
            margin-top: 30px;
            overflow: hidden;
            padding: 2px;
        }
        .energy-bar {
            height: 100%;
            background: #38bdf8;
            border-radius: 8px;
            width: 100%;
            transition: width 0.2s ease;
        }
        .energy-text {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 8px;
        }

        /* Картки завдань / прокачки */
        .item-card {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .item-info h4 {
            font-size: 16px;
            margin-bottom: 4px;
        }
        .item-info p {
            font-size: 13px;
            color: #94a3b8;
        }
        .item-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Нижня панель навігації */
        .nav-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 75px;
            background: #1e293b;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #334155;
            max-width: 480px;
            margin: 0 auto;
        }
        .nav-item {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1;
        }
        .nav-item.active {
            color: #38bdf8;
        }
        .nav-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="content">
        
        <!-- ВКЛАДКА 1: КЛІКЕР -->
        <div id="tab-clicker" class="tab-content active">
            <div class="header-stats">
                <div class="stat-item">
                    <div class="stat-value" id="ui-level">1</div>
                    <div class="stat-label">Рівень</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="ui-gems">0</div>
                    <div class="stat-label">Кристали</div>
                </div>
            </div>

            <div class="clicker-section">
                <div class="coin-display"><span id="ui-score">0</span> 🪙</div>
                <button class="click-btn" id="click-btn" onclick="handleClick(event)">🪙</button>
                
                <div style="width: 100%; margin-top: 20px;">
                    <div class="energy-bar-container">
                        <div class="energy-bar" id="ui-energy-bar"></div>
                    </div>
                    <div class="energy-text"><span id="ui-energy">1000</span> / <span id="ui-max-energy">1000</span></div>
                </div>
            </div>
        </div>

        <!-- ВКЛАДКА 2: ПОКРАЩЕННЯ -->
        <div id="tab-upgrades" class="tab-content">
            <h2 style="margin-bottom: 15px;">Прокачка</h2>
            <div class="item-card">
                <div class="item-info">
                    <h4>Сила кліку</h4>
                    <p>+1 монета за клік (Ціна: 50)</p>
                </div>
                <button class="item-btn" onclick="buyUpgrade('click')">Купити</button>
            </div>
        </div>

        <!-- ВКЛАДКА 3: ТЕСТОВЕ КЕРУВАННЯ (Скидання / Повернення) -->
        <div id="tab-admin" class="tab-content">
            <h2 style="margin-bottom: 15px;">Тест: Скидання даних</h2>
            <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">
                Використовуйте ці кнопки прямо з телефона, щоб протестувати обнулення та відновлення.
            </p>

            <div class="item-card" style="border-color: #ef4444;">
                <div class="item-info">
                    <h4>🧪 Скинути все</h4>
                    <p>Обнулити баланс і рівень до нуля</p>
                </div>
                <button class="item-btn" style="background: #ef4444; color: white;" onclick="testResetToZero()">Скинути</button>
            </div>

            <div class="item-card" style="border-color: #22c55e;">
                <div class="item-info">
                    <h4>🧪 Повернути прогрес</h4>
                    <p>Вписати свої цифри назад</p>
                </div>
                <button class="item-btn" style="background: #22c55e; color: white;" onclick="testRestoreProgress()">Повернути</button>
            </div>
        </div>

    </div>

    <!-- НИЖНЯ ПАНЕЛЬ НАВІГАЦІЇ -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('clicker', this)">
            <span class="nav-icon">🪙</span>
            <span>Клікер</span>
        </button>
        <button class="nav-item" onclick="switchTab('upgrades', this)">
            <span class="nav-icon">⚡</span>
            <span>Прокачка</span>
        </button>
        <button class="nav-item" onclick="switchTab('admin', this)">
            <span class="nav-icon">⚙️</span>
            <span>Тест (Скидання)</span>
        </button>
    </div>
</div>

<script>
    // Ігрові змінні
    let game = {
        score: parseInt(localStorage.getItem('tabcoin_score')) || 0,
        gems: parseInt(localStorage.getItem('tabcoin_gems')) || 0,
        energy: parseInt(localStorage.getItem('tabcoin_energy')) || 1000,
        maxEnergy: parseInt(localStorage.getItem('tabcoin_maxEnergy')) || 1000,
        clickPower: parseInt(localStorage.getItem('tabcoin_clickPower')) || 1,
        level: parseInt(localStorage.getItem('tabcoin_level')) || 1
    };

    // Оновлення інтерфейсу на екрані
    function updateUI() {
        document.getElementById('ui-score').innerText = game.score;
        document.getElementById('ui-gems').innerText = game.gems;
        document.getElementById('ui-level').innerText = game.level;
        document.getElementById('ui-energy').innerText = game.energy;
        document.getElementById('ui-max-energy').innerText = game.maxEnergy;
        
        let energyPercent = (game.energy / game.maxEnergy) * 100;
        document.getElementById('ui-energy-bar').style.width = energyPercent + '%';
    }

    // Збереження в пам'ять телефона
    function saveGame() {
        localStorage.setItem('tabcoin_score', game.score);
        localStorage.setItem('tabcoin_gems', game.gems);
        localStorage.setItem('tabcoin_energy', game.energy);
        localStorage.setItem('tabcoin_maxEnergy', game.maxEnergy);
        localStorage.setItem('tabcoin_clickPower', game.clickPower);
        localStorage.setItem('tabcoin_level', game.level);
    }

    // Клік по монеті
    function handleClick(event) {
        if (game.energy >= game.clickPower) {
            game.score += game.clickPower;
            game.energy -= game.clickPower;
            saveGame();
            updateUI();
        }
    }

    // Відновлення енергії з часом
    setInterval(() => {
        if (game.energy < game.maxEnergy) {
            game.energy = Math.min(game.maxEnergy, game.energy + 3);
            saveGame();
            updateUI();
        }
    }, 1000);

    // Перемикання вкладок
    function switchTab(tabId, element) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
        
        document.getElementById('tab-' + tabId).classList.add('active');
        element.classList.add('active');
    }

    // Покупка апгрейду (приклад)
    function buyUpgrade(type) {
        if (type === 'click' && game.score >= 50) {
            game.score -= 50;
            game.clickPower += 1;
            saveGame();
            updateUI();
            alert('Успішно куплено!');
        } else {
            alert('Недостатньо монет!');
        }
    }

    /* ==========================================
       ФУНКЦІЇ ТЕСТОВОГО СКИНУ ТА ПОВТОРНОГО ПОВЕРНЕННЯ
       ========================================== */

    // 1. Повне обнулення
    function testResetToZero() {
        if (confirm("Точно скинути все до нуля?")) {
            localStorage.setItem('tabcoin_score', '0');
            localStorage.setItem('tabcoin_gems', '0');
            localStorage.setItem('tabcoin_energy', '1000');
            localStorage.setItem('tabcoin_maxEnergy', '1000');
            localStorage.setItem('tabcoin_clickPower', '1');
            localStorage.setItem('tabcoin_level', '1');
            location.reload();
        }
    }

    // 2. Відновлення попередніх даних через віконця на телефоні
    function testRestoreProgress() {
        let savedScore = prompt("Введіть скільки у вас було монет:", "500000");
        let savedGems = prompt("Введіть скільки у вас було кристалів:", "100");
        let savedLevel = prompt("Введіть який у вас був рівень:", "5");

        if (savedScore !== null && savedGems !== null && savedLevel !== null) {
            localStorage.setItem('tabcoin_score', savedScore);
            localStorage.setItem('tabcoin_gems', savedGems);
            localStorage.setItem('tabcoin_level', savedLevel);
            location.reload();
        }
    }

    // Запуск при завантаженні
    updateUI();
</script>

</body>
</html>
